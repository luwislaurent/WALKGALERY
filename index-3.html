<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WALK — Never Finished</title><style>
@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
*{box-sizing:border-box}body{margin:0;background:#fff;color:#080808;font-family:Arial,sans-serif;overflow:hidden}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}button:focus-visible{outline:2px solid #777;outline-offset:4px}.page{position:fixed;inset:0;display:none;background:white}.page.active{display:block}.heavy,h1,h2,.menu button{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400;letter-spacing:-.025em} .brand{display:flex;align-items:baseline;white-space:nowrap;line-height:1;gap:.15em;font-size:clamp(28px,4vw,62px)}.brand small{font-size:.35em;letter-spacing:0}.home{padding:2vw}.menu{margin-top:1.2vh}.menu button{width:100%;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ccc;padding:.25vh 0;font-size:clamp(25px,6.8vw,110px);line-height:1.17;text-align:left}.menu button:last-child{border-bottom:1px solid #ccc}.menu button:hover{color:#777}.back{position:absolute;bottom:18px;right:22px;font-size:10px;letter-spacing:.05em;z-index:5;background:white;padding:7px}.hero{position:absolute;inset:2% 2% 5%;display:flex;align-items:center;justify-content:center}.hero svg{width:100%;height:100%;overflow:visible}.galleryViewport{height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;cursor:grab}.galleryViewport::-webkit-scrollbar{display:none}.galleryViewport.dragging{cursor:grabbing}.wall{position:relative;width:max-content;min-height:100%;display:flex;align-items:center;gap:4.5vw;padding:15vh 5vw 8vh}.wall .brand{position:absolute;top:3vh;left:2vw}.work{flex:none;width:15vw;min-width:125px;padding:0;text-align:left;user-select:none}.photo{width:100%;aspect-ratio: .57;background:#d7d7d7;display:block;object-fit:cover;pointer-events:none}.special .photo{background:#aaa}.plaque{display:block;margin-top:10px;width:50%;height:15px;background:#ddd;font-size:0}.endwall{width:48vw;min-width:220px;border-right:2px solid #bbb;height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.emptyframe{width:35%;aspect-ratio:.57;border:1px dashed #ccc}.endwall span{font-size:11px;letter-spacing:.15em}.overlay{position:fixed;inset:0;background:#fffffff5;z-index:20;display:none;align-items:center;justify-content:center;gap:5vw;padding:8vw}.overlay.open{display:flex}.detailPhoto{height:75vh;max-width:55vw;aspect-ratio:.57;background:#d7d7d7;object-fit:contain}.detailText{max-width:280px;font-size:13px;line-height:1.6}.close{position:absolute;right:25px;top:20px;font-size:25px}.scene{width:100%;height:100%;display:block;touch-action:none;cursor:ns-resize}.hint{position:absolute;bottom:20px;left:22px;font-size:10px;letter-spacing:.09em;pointer-events:none;background:#fff;padding:6px}.turn{animation:turn .85s ease both}@keyframes turn{0%{transform:perspective(800px) rotateY(-65deg) scale(.87);opacity:0}100%{transform:none;opacity:1}}.streetLabel{position:absolute;top:20px;left:22px;font-size:12px;letter-spacing:.12em;pointer-events:none}.objects{position:absolute;inset:0;pointer-events:none}@media(max-width:600px){.work{width:38vw}.wall{gap:7vw}.menu button{font-size:8vw}.overlay{flex-direction:column;gap:15px}.detailPhoto{height:57vh;max-width:85vw}.detailText{max-width:85vw}.hero{inset:10% 2% 10%}}

.brand{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:900;letter-spacing:-.04em}.menu button{font-weight:900}.work{width: min(15.3vw, 34vh);min-width:100px}.wall{gap:4.5vw;padding-left:2vw;padding-right:0}.endwall{flex:none;background:linear-gradient(90deg,#fff 90%,#eee);border-right:8px solid #ddd}.plaque.filled{background:none;height:auto;font-size:10px;line-height:1.3}.turn-away{animation:away .45s ease-in both}@keyframes away{to{transform:perspective(900px) rotateY(65deg);opacity:0}}.hero{inset:2% 2% 5%}.detailPhoto{flex-shrink:0}.streetLabel{font-size:10px}@media(max-width:600px){.work{width:38vw;min-width:100px}.wall{gap:7vw}.hero{inset:3% 3% 7%}.menu button{font-size:8vw}}@media(prefers-reduced-motion:reduce){.turn,.turn-away{animation-duration:.01s}}
</style></head><body>
<section class="page home active" id="home"><div class="brand">WALK<small>NEVER FINISHED</small></div><nav class="menu"><button data-go="screen"><span>PO.1</span><span>HET SCHERM</span></button><button data-go="gallery"><span>PO.2</span><span>HET BEELD</span></button><button data-go="corridor"><span>PO.3</span><span>TWEE SCHERMEN</span></button><button data-go="street"><span>PO.4</span><span>DE HANDELING</span></button></nav></section>
<section class="page" id="screen"><div class="hero"><svg viewBox="0 0 1000 600" preserveAspectRatio="none" aria-label="WALK never finished"><text x="0" y="0" font-family="Anton, Impact, sans-serif" font-size="200" id="walkText">WALK</text><rect id="wordMask" fill="white"/><text id="vertical" font-family="Anton, Impact, sans-serif" font-size="22">NEVER FINISHED</text></svg></div><button class="back" data-go="home">BACK TO WALK THAT'S NEVER ENDING ↗</button></section>
<section class="page" id="gallery"><div class="galleryViewport" id="viewport"><div class="wall" id="wall"><div class="brand">WALK<small>GALLERY</small></div></div></div><button class="back" data-go="home">BACK TO WALK THAT'S NEVER ENDING ↗</button></section>
<section class="page" id="space"><canvas class="scene" id="scene"></canvas><div class="streetLabel" id="streetLabel"></div><div class="hint">SCROLL / DRAG / ↑ ↓ TO WALK</div><button class="back" id="spaceBack">BACK TO GALLERY ↗</button></section>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Photograph detail"><button class="close" aria-label="Close">×</button><div id="detailPhoto" class="detailPhoto"></div><div class="detailText"><strong id="detailTitle"></strong><p id="detailCaption"></p></div></div>
<script>
// PHOTO SETTINGS: set src to images/walk01.jpg, caption to your observation,
// and objectSrc to an optional transparent PNG of the same object.
// To add a work, increase the length or add a new object to works.
const works=Array.from({length:20},(_,i)=>({src:'',title:`WALK / ${String(i+1).padStart(2,'0')}`,caption:'Observation — text to be added.',objectSrc:'',portal:i===3}));
const $=s=>document.querySelector(s), wall=$('#wall'), viewport=$('#viewport'), overlay=$('#overlay');let current='home',savedScroll=0,depth=.46,raf=0,transitioning=false,detailTrigger=null;
function fitWord(){const t=$('#walkText');t.removeAttribute('transform');const b=t.getBBox();if(!b.width)return;const sx=1000/b.width,sy=600/b.height;t.setAttribute('transform',`scale(${sx} ${sy}) translate(${-b.x} ${-b.y})`);const v=$('#vertical');v.setAttribute('transform','translate(755 505) rotate(-90)');v.setAttribute('fill','black');const mask=$('#wordMask');mask.setAttribute('x','733');mask.setAttribute('y','350');mask.setAttribute('width','30');mask.setAttribute('height','160');v.setAttribute('textLength','150');v.setAttribute('lengthAdjust','spacingAndGlyphs');}
function go(name){if(current==='gallery')savedScroll=viewport.scrollLeft;closeDetail();document.querySelectorAll('.page').forEach(p=>p.classList.remove('active','turn-away'));current=name;if(name==='corridor'||name==='street'){const p=$('#space');p.classList.add('active');p.classList.remove('turn');void p.offsetWidth;p.classList.add('turn');depth=name==='street'?-0.6:.46;draw();}else{document.getElementById(name).classList.add('active');if(name==='gallery')viewport.scrollLeft=savedScroll;if(name==='screen'){fitWord();document.fonts.ready.then(()=>{if(current==='screen')fitWord()})}}}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
works.forEach((w,i)=>{const b=document.createElement('button');b.className='work'+(w.portal?' special':'');b.setAttribute('aria-label',w.title);const pic=document.createElement(w.src?'img':'span');pic.className='photo';if(w.src){pic.src=w.src;pic.alt=w.title;}const plaque=document.createElement('span');plaque.className='plaque';plaque.textContent=w.title;if(w.src)plaque.classList.add('filled');b.append(pic,plaque);b.onclick=()=>{if(moved)return;if(transitioning)return;if(w.portal){transitioning=true;$('#gallery').classList.add('turn-away');setTimeout(()=>{go('corridor');transitioning=false},matchMedia('(prefers-reduced-motion: reduce)').matches?10:450);return}detailTrigger=b;openDetail(w)};wall.append(b)});const end=document.createElement('div');end.className='endwall';end.innerHTML='<div class="emptyframe"></div><span>TO BE CONTINUED.</span>';wall.append(end);
function openDetail(w){const el=$('#detailPhoto');el.replaceChildren();el.style.background=w.src?'white':'#d7d7d7';if(w.src){const img=new Image();img.src=w.src;img.alt=w.title;img.style.cssText='width:100%;height:100%;object-fit:contain';el.append(img)}$('#detailTitle').textContent=w.title;$('#detailCaption').textContent=w.caption;overlay.classList.add('open');overlay.querySelector('button').focus()}
function closeDetail(){if(overlay.classList.contains('open')){overlay.classList.remove('open');detailTrigger?.focus({preventScroll:true});detailTrigger=null}}overlay.onclick=e=>{if(!e.target.closest('.detailPhoto')&&!e.target.closest('.detailText')||e.target.closest('.close'))closeDetail()};
viewport.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();viewport.scrollLeft+=e.deltaY}},{passive:false});let down=false,moved=false,startX=0,startScroll=0;viewport.addEventListener('pointerdown',e=>{moved=false;if(e.pointerType!=='mouse')return;down=true;startX=e.clientX;startScroll=viewport.scrollLeft});window.addEventListener('pointermove',e=>{if(!down)return;if(Math.abs(e.clientX-startX)>5){moved=true;viewport.classList.add('dragging');viewport.scrollLeft=startScroll-(e.clientX-startX)}});window.addEventListener('pointerup',()=>{down=false;viewport.classList.remove('dragging');setTimeout(()=>moved=false,0)});
const canvas=$('#scene'),ctx=canvas.getContext('2d');const objects=works.map(w=>{if(!w.objectSrc)return null;const im=new Image();im.onload=()=>draw();im.src=w.objectSrc;return im});function poly(points,fill){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function draw(){if(!['corridor','street'].includes(current))return;const W=canvas.clientWidth,H=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(!W||!H)return;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const cx=W/2,cy=H*.53,street=Math.max(0,Math.min(1,-depth*2)),mix=(a,b)=>Math.round(a+(b-a)*street),gray=(a,b)=>`rgb(${mix(a,b)},${mix(a,b)},${mix(a,b)})`;ctx.fillStyle=gray(255,234);ctx.fillRect(0,0,W,H);const focal=W*.65,eye=1.6,cam=depth*17,far=24;function P(x,y,z){const s=focal/Math.max(.15,z-cam);return[cx+x*s,cy-(y-eye)*s]}const Z=cam+.18, F=far;poly([P(-5,0,Z),P(5,0,Z),P(5,0,F),P(-5,0,F)],gray(160,105));poly([P(-5,0,Z),P(-5,4,Z),P(-5,4,F),P(-5,0,F)],gray(247,187));poly([P(5,0,Z),P(5,4,Z),P(5,4,F),P(5,0,F)],gray(247,187));poly([P(-5,4,Z),P(5,4,Z),P(5,4,F),P(-5,4,F)],gray(255,234));poly([P(-5,0,F),P(5,0,F),P(5,4,F),P(-5,4,F)],gray(248,220));for(let z=F-1;z>cam+.3;z-=2.7){for(const side of [-1,1]){let x=side*4.98;poly([P(x,.35,z),P(x,3.55,z),P(x,3.55,Math.max(z-1.9,cam+.2)),P(x,.35,Math.max(z-1.9,cam+.2))],gray(210,145));if(street>.35){ // Abstract street objects, to be replaced with actual photographed objects.
let xx=side*3.2;const im=objects[(Math.round((F-z)/2.7)*2+(side===1?1:0))%objects.length];ctx.globalAlpha=Math.min(1,(street-.35)/.45);if(im&&im.complete&&im.naturalWidth){const a=P(xx,0,z),b=P(xx,1.6,z),h=a[1]-b[1],w=h*im.naturalWidth/im.naturalHeight;ctx.drawImage(im,a[0]-w/2,b[1],w,h)}else{poly([P(xx,0,z),P(xx+.5,0,z),P(xx+.5,1.2,z),P(xx,1.2,z)],gray(210,90));}ctx.globalAlpha=1;}}if(street<.6){const l=P(0,3.97,z);ctx.beginPath();ctx.ellipse(l[0],l[1],Math.max(1,Math.min(100,120/(z-cam))),Math.max(1,Math.min(18,20/(z-cam))),0,0,Math.PI*2);ctx.fillStyle='#ddd';ctx.fill()}}
const q=P(0,1.4,F);ctx.fillStyle='#080808';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${Math.max(12,Math.min(H*.7,focal*1.65/(F-cam)))}px Anton, Impact, sans-serif`;ctx.globalAlpha=1-street;ctx.fillText('WALK',q[0],q[1]);ctx.globalAlpha=1;$('#streetLabel').textContent=street>.5?'WALK / THE STREET':'';}
function step(d){depth=Math.max(-1.25,Math.min(1.39,depth+d));if(depth>=1.34){go('home');return}draw()}
canvas.addEventListener('wheel',e=>{e.preventDefault();step(e.deltaY*.0015)},{passive:false});let lastY=null;canvas.addEventListener('pointerdown',e=>{lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(lastY===null)return;step((lastY-e.clientY)*.004);lastY=e.clientY});canvas.addEventListener('pointerup',()=>lastY=null);canvas.addEventListener('pointercancel',()=>lastY=null);$('#spaceBack').onclick=()=>go('gallery');window.addEventListener('resize',()=>{if(current==='screen')fitWord();draw()});document.fonts.ready.then(draw);window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(overlay.classList.contains('open'))closeDetail();else if(current==='corridor'||current==='street')go('gallery');else go('home')}if(['corridor','street'].includes(current)){if(e.key==='ArrowUp'){e.preventDefault();step(.08)}if(e.key==='ArrowDown'){e.preventDefault();step(-.08)}}else if(current==='gallery'){if(e.key==='ArrowRight')viewport.scrollLeft+=180;if(e.key==='ArrowLeft')viewport.scrollLeft-=180}});
</script></body></html>
